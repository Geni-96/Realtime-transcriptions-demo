<!DOCTYPE html>
<html>
  <head>
    <title>My Sidepanel</title>
  </head>
  <body>
    <h1>Live Transcripts</h1>
    <div style="margin-bottom: 8px;">
      <label style="margin-right: 12px;">
        <input id="includeMicrophone" type="checkbox" /> Include microphone
      </label>
    </div>
    <div style="margin-bottom: 8px;">
      <label for="engineSelect" style="margin-right: 8px;">Transcription engine:</label>
      <select id="engineSelect">
        <option value="gemini">Gemini (cloud)</option>
        <option value="faster_whisper">Faster Whisper (WebSocket)</option>
      </select>
    </div>
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="downloadBtn" disabled>Download transcript</button>
  <div id="status" style="margin: 8px 0; color: #555; font-size: 12px;"></div>
  <div id="transcript" style="white-space: pre-wrap; line-height: 1.4;"></div>
  <script src="./sidepanel.js"></script>
  </body>
</html>
